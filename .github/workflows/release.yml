# Builds Kronos Remote Support from the private source repository and publishes the
# installers + latest.json (in-app updater) as a release of THIS public repository.
# Public repository: GitHub Actions minutes are free. Manual trigger only:
#   gh workflow run release.yml -R albarth84/Remote-Desktop-releases -f tag=v0.7.0
#
# Secrets: SOURCE_SSH_KEY (read-only deploy key of the source repo),
# TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD) to sign update packages,
# APPLE_CERTIFICATE(+_PASSWORD), APPLE_SIGNING_IDENTITY, KEYCHAIN_PASSWORD for macOS code signing.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Source tag to build (e.g. v0.7.0)
        required: true

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: ""
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: albarth84/Remote-Desktop
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
      - name: System dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
      - name: Frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing with a stable (self-signed) identity: macOS then recognises
          # every update as the same app and keeps its Screen Recording / Accessibility
          # permissions. Not a Developer ID: Gatekeeper still warns on first download.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag }}
          releaseName: Kronos Remote Support ${{ inputs.tag }}
          releaseBody: Aggiornamento di Kronos Remote Support. Si installa dal pulsante "Aggiornamenti" nell'app.
          releaseCommitish: main
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
